<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"><div class="brand">CETEP</div><a class="btn secondary" href="/login">Espace membre</a></header>
<main class="wrap"><section class="hero"><h1>Centre d'Encadrement Technique et Professionnel</h1><p>Formation • Orientation • Insertion professionnelle</p><a class="btn" href="#admission">Demander une admission</a></section>
<section class="card" style="margin-top:20px"><h2>Nos formations</h2><div id="programs" class="grid"></div></section>
<section id="admission" class="card" style="margin-top:20px"><h2>Admission en ligne</h2><form id="ad"><div class="row"><div><label>Nom complet</label><input class="input" name="name" required></div><div><label>Téléphone</label><input class="input" name="phone" required></div></div><div class="row"><div><label>Email</label><input class="input" name="email"></div><div><label>Date de naissance</label><input class="input" name="birth_date" type="date"></div></div><label>Formation</label><select class="input" name="program" id="program" required></select><label>Niveau d'études</label><input class="input" name="education"><button class="btn">Envoyer la demande</button></form><p id="msg"></p></section></main>
<script>
async function load(){let p=await fetch('/api/public/programs').then(r=>r.json());document.querySelector('#programs').innerHTML=p.map(x=>`<div class="card"><h3>${x.name}</h3><p>${x.description||''}</p><span class="pill">${x.duration||''}</span></div>`).join('');document.querySelector('#program').innerHTML='<option value="">Choisir</option>'+p.map(x=>`<option>${x.name}</option>`).join('')}
load();document.querySelector('#ad').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/admissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();document.querySelector('#msg').textContent=r.ok?`Demande reçue. Votre numéro: ${j.student_no}`:(j.error||'Erreur');if(r.ok)e.target.reset()}
</script></body></html>
