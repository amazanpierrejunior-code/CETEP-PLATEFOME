<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="brand-wrap"><div id="logo" class="logo">CETEP</div><div><div id="name" class="brand">CETEP</div><div id="full" class="brand-sub">Centre d'Encadrement Technique et Professionnel</div></div></div><a class="btn secondary" href="/login">Espace administration</a></header><main class="wrap"><section class="hero"><h1 id="heroTitle">Centre d'Encadrement Technique et Professionnel</h1><p id="slogan">Formation • Orientation • Insertion professionnelle</p></section><section class="card"><h2>Nos formations</h2><div id="programs" class="grid"></div></section><section class="card"><h2>Admission en ligne</h2><form id="ad"><div class="row"><input class="input" name="name" placeholder="Nom complet" required><input class="input" name="phone" placeholder="Téléphone" required></div><div class="row"><input class="input" name="email" type="email" placeholder="Email"><input class="input" name="birth_date" type="date"></div><select class="input" name="program_id" id="program" required><option value="">Choisir une formation</option></select><input class="input" name="education" placeholder="Niveau d'études"><button class="btn">Envoyer la demande</button></form><p id="msg"></p></section></main><script>async function init(){const s=await fetch('/api/public/settings').then(r=>r.json());document.documentElement.style.setProperty('--primary',s.primary_color);document.documentElement.style.setProperty('--secondary',s.secondary_color);document.documentElement.style.setProperty('--accent',s.accent_color);name.textContent=s.school_name;full.textContent=s.school_full_name;heroTitle.textContent=s.school_full_name;slogan.textContent=s.slogan;logo.textContent=s.logo_text||s.school_name;if(s.logo_url)logo.innerHTML='<img src="'+s.logo_url+'" alt="Logo">';const p=await fetch('/api/public/programs').then(r=>r.json());programs.innerHTML=p.map(x=>'<div class="card"><h3>'+x.name+'</h3><p>'+ (x.description||'')+'</p><span class="pill">'+(x.duration||'')+'</span></div>').join('');program.innerHTML='<option value="">Choisir une formation</option>'+p.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')}init();ad.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();msg.textContent=r.ok?'Demande reçue. Votre numéro est '+j.student_no+'.':j.error;if(r.ok)e.target.reset()}</script></body></html>
