<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Pièces justificatives</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f6fb}.wrap{max-width:1180px;margin:24px auto;padding:16px}.doc{background:#fff;border:1px solid #dce4ef;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#64748b}.tag{padding:4px 9px;border-radius:20px;background:#fff4d6}.btn{cursor:pointer}</style></head><body><header class="top"><div><h2>CETEP — Pièces justificatives</h2><small>Consultation et vérification sécurisées des dossiers</small></div><a class="btn secondary" href="/admin">Administration</a></header><main class="wrap"><div class="card"><div class="row"><input id="q" class="input" placeholder="Rechercher nom ou code étudiant"><button class="btn" id="refresh">↻ Actualiser</button></div><p id="status" class="muted">Chargement…</p><div id="list"></div></div></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){ $('#status').textContent='Chargement…';try{const r=await fetch('/api/secretary/applicant-documents?q='+encodeURIComponent($('#q').value),{credentials:'same-origin'});const data=await r.json();if(!r.ok)throw Error(data.error||'Accès refusé. Connectez-vous comme secrétaire ou administrateur.');$('#status').textContent=data.length+' document(s) trouvé(s).';$('#list').innerHTML=data.map(d=>`<article class="doc"><div class="row"><div style="flex:1"><b>${esc(d.student_name)}</b> — ${esc(d.student_no)}<br><b>${esc(({identite:'Pièce d’identité',acte_naissance:'Acte de naissance',photo_passeport:'Photo passeport',diplome_certificat:'Diplôme / certificat',autre:'Autre document'})[d.document_type]||d.document_type)}</b><br><span class="muted">${esc(d.original_name)} · ${(d.file_size/1024/1024).toFixed(2)} Mo · ${esc(d.uploaded_at)}</span></div><span class="tag">${esc(d.status)}</span><a class="btn secondary" target="_blank" rel="noopener" href="/api/secretary/applicant-documents/${d.id}/file">Ouvrir</a></div><p>${esc(d.review_note||'')}</p><div class="row"><button class="btn" onclick="review(${d.id},'Validé')">✓ Valider</button><button class="btn secondary" onclick="review(${d.id},'Refusé')">✕ Refuser</button><button class="btn secondary" onclick="review(${d.id},'En attente')">↺ Remettre en attente</button></div></article>`).join('')||'<p>Aucun document reçu pour le moment.</p>'}catch(e){$('#status').textContent=e.message;$('#list').innerHTML=''}}
async function review(id,status){const note=status==='Refusé'?prompt('Indiquez le motif du refus :')||'':prompt('Observation (facultatif) :')||'';try{const r=await fetch('/api/secretary/applicant-documents/'+id+'/review',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({status,note})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');load()}catch(e){alert(e.message)}}$('#refresh').onclick=load;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script></body></html>
