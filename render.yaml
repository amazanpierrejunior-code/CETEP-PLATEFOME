services:
  - type: web
    name: cetep-plateforme
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CETEP_NOTIFICATION_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DATA_DIR
        value: /app/data
    disk:
      name: cetep-data
      mountPath: /app/data
      sizeGB: 1
