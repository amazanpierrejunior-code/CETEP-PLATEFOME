services:
  - type: web
    name: cetep-plateforme
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_DIR
        value: /app/data
    disk:
      name: cetep-data
      mountPath: /app/data
      sizeGB: 1
