<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Espace professeur</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div><div class="brand">CETEP — Espace professeur</div><div class="brand-sub" id="me"></div></div><button class="btn secondary" onclick="logout()">Déconnexion</button></header><main class="container"><div class="grid"><div class="card"><h2>Mes formations</h2><div id="programs"></div></div><div class="card"><h2>Mes étudiants</h2><div id="students"></div></div></div><div class="card"><h2>Créer un module</h2><form id="mf"><select class="input" name="program_id" id="p" required></select><input class="input" name="title" placeholder="Titre" required><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn">Créer</button></form></div><div class="card"><h2>Créer une leçon / cours online</h2><form id="lf"><select class="input" name="module_id" id="m" required></select><input class="input" name="title" placeholder="Titre" required><select class="input" name="type"><option>Texte</option><option>Vidéo</option><option>PDF</option><option>Classe en ligne</option></select><textarea class="input" name="content" placeholder="Contenu du cours"></textarea><input class="input" name="video_url" placeholder="Lien vidéo"><input class="input" name="file_url" placeholder="Lien document/PDF"><button class="btn">Publier</button></form></div><div class="card"><h2>Mes modules</h2><div id="modules"></div></div></main><script>const $=s=>document.querySelector(s),fo=f=>Object.fromEntries(new FormData(f));async function api(u,o){const r=await fetch(u,o);if(r.status===401)location='/login';const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){const [me,p,m,s]=await Promise.all([api('/api/teacher/me'),api('/api/teacher/programs'),api('/api/teacher/modules'),api('/api/teacher/students')]);$('#me').textContent=me.name+' • '+me.teacher_no;$('#programs').innerHTML=p.map(x=>'<div class="card"><b>'+x.name+'</b><br>'+x.duration+'</div>').join('');$('#students').innerHTML=s.map(x=>'<div>'+x.student_no+' — '+x.name+' <small>'+x.program_name+'</small></div>').join('');$('#p').innerHTML=p.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');$('#m').innerHTML=m.map(x=>'<option value="'+x.id+'">'+x.program_name+' — '+x.title+'</option>').join('');$('#modules').innerHTML=m.map(x=>'<div class="card"><b>'+x.program_name+' — '+x.title+'</b><p>'+x.description+'</p></div>').join('')}$('#mf').onsubmit=async e=>{e.preventDefault();try{await api('/api/teacher/modules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});e.target.reset();load()}catch(e){alert(e.message)}};$('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/teacher/lessons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});e.target.reset();alert('Cours publié.')}catch(e){alert(e.message)}};async function logout(){await api('/api/logout',{method:'POST'});location='/login'}load()</script></body></html>
