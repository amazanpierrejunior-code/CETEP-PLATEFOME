<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace professeur CETEP</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"><div class="brand">CETEP — Espace professeur</div><button class="btn secondary" onclick="logout()">Déconnexion</button></header><main class="wrap"><div id="me" class="card"></div><section class="card" style="margin-top:20px"><h2>Mes formations</h2><div id="programs"></div></section><section class="card" style="margin-top:20px"><h2>Mes étudiants</h2><div id="students"></div></section><section id="progress" class="card hidden" style="margin-top:20px"></section></main>
<script>
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(u,o){let r=await fetch(u,o);if(r.status===401){location.href='/login';return null}let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
async function load(){let [m,p,s]=await Promise.all([api('/api/teacher/me'),api('/api/teacher/programs'),api('/api/teacher/students')]);$('#me').innerHTML=`<h1>Bonjour ${esc(m.name)}</h1><p>Code professeur: <b>${esc(m.teacher_no)}</b></p>`;$('#programs').innerHTML=p.length?p.map(x=>`<div class="lesson"><b>${esc(x.name)}</b> — ${esc(x.duration||'')}</div>`).join(''):'Aucune formation attribuée.';$('#students').innerHTML=s.length?'<table class="table"><tr><th>Code</th><th>Nom</th><th>Formation</th><th>Statut</th><th></th></tr>'+s.map(x=>`<tr><td>${esc(x.student_no)}</td><td>${esc(x.name)}</td><td>${esc(x.program_name)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="progress(${x.id},'${esc(x.name)}')">Voir progrès</button></td></tr>`).join('')+'</table>':'Aucun étudiant.'}
async function progress(id,name){let d=await api('/api/teacher/progress/'+id);$('#progress').classList.remove('hidden');$('#progress').innerHTML=`<h2>Progression de ${esc(name)}</h2><div class="progress"><i style="width:${d.progress}%"></i></div><p>${d.progress}% complété</p>`+d.lessons.map(x=>`<div class="lesson">${x.completed?'✅':'⬜'} ${esc(x.module_title)} — ${esc(x.title)}</div>`).join('')}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}load()
</script></body></html>
