<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion CETEP</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="wrap login"><div class="card"><h1>Connexion CETEP</h1><p class="muted">Choisissez votre espace.</p>
<div class="grid"><button class="btn" onclick="show('admin')">Administration</button><button class="btn" onclick="show('student')">Étudiant</button><button class="btn" onclick="show('teacher')">Professeur</button></div>
<form id="admin" class="box" style="margin-top:20px"><h3>Administration</h3><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Entrer</button></form>
<form id="student" class="box hidden" style="margin-top:20px"><h3>Espace étudiant</h3><input class="input" name="code" placeholder="CETEP-2026-0001" required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Entrer</button></form>
<form id="teacher" class="box hidden" style="margin-top:20px"><h3>Espace professeur</h3><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Entrer</button></form><p id="msg"></p></div></div>
<script>
function show(x){document.querySelectorAll('.box').forEach(e=>e.classList.add('hidden'));document.getElementById(x).classList.remove('hidden')}
async function login(form,url){form.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(form));let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(r.ok)location.href=j.redirect;else document.querySelector('#msg').textContent=j.error||'Erreur'}}
login(document.getElementById('admin'),'/api/login');login(document.getElementById('student'),'/api/student/login');login(document.getElementById('teacher'),'/api/teacher/login');
</script></body></html>
