<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion CETEP</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="card" style="max-width:460px;margin:70px auto"><h1>CETEP — Administration</h1><form id="f"><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Se connecter</button></form><p id="m"></p><a href="/">← Retour au site</a></section></main><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();if(r.ok)location.href='/admin';else m.textContent=j.error||'Erreur'}</script></body></html>
