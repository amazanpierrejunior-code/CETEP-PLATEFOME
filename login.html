<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Connexion</title><link rel="stylesheet" href="/style.css"></head><body><main class="container" style="max-width:500px;padding-top:80px"><div class="card"><h1>CETEP — Connexion</h1><div class="row"><button class="btn" onclick="show('admin')">Administration</button><button class="btn" onclick="show('teacher')">Professeur</button><button class="btn" onclick="show('student')">Étudiant</button></div><form id="admin" style="margin-top:20px"><input class="input" name="email" type="email" placeholder="Email administrateur" required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Se connecter</button></form><form id="teacher" class="hidden" style="margin-top:20px"><input class="input" name="email" type="email" placeholder="Email professeur" required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Espace professeur</button></form><form id="student" class="hidden" style="margin-top:20px"><input class="input" name="code" placeholder="Code CETEP-..." required><input class="input" name="password" type="password" placeholder="Mot de passe" required><button class="btn">Espace étudiant</button></form><p id="msg"></p><a href="/">← Retour au site</a></div></main><script>const $=s=>document.querySelector(s);function show(x){['admin','teacher','student'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==x));$('#msg').textContent=''}async function go(e,u){e.preventDefault();const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();if(r.ok)location.href=j.redirect;else $('#msg').textContent=j.error||'Erreur'}$('#admin').onsubmit=e=>go(e,'/api/login');$('#teacher').onsubmit=e=>go(e,'/api/teacher/login');$('#student').onsubmit=e=>go(e,'/api/student/login');</script></body></html>
