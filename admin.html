<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Administration</title><link rel="stylesheet" href="admin.css"></head><body><div class="wrap"><div id="login" class="panel"><h1>Administration CETEP</h1><p>Connexion sécurisée</p><form id="loginForm"><input name="email" type="email" placeholder="E-mail administrateur" required><input name="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button><div id="loginMsg"></div></form></div><div id="app" hidden><header><h1>Tableau de bord CETEP</h1><button id="logout">Déconnexion</button></header><div id="stats" class="stats"></div><div class="panel"><h2>Étudiants / admissions</h2><div class="scroll"><table><thead><tr><th>N°</th><th>Nom</th><th>Formation</th><th>Téléphone</th><th>Statut</th></tr></thead><tbody id="students"></tbody></table></div></div><div class="panel"><h2>Formations</h2><form id="programForm" class="row"><input name="name" placeholder="Nom" required><input name="duration" placeholder="Durée"><input name="price_htg" type="number" placeholder="Prix HTG"><input name="description" placeholder="Description"><button>Ajouter</button></form><div id="programs"></div></div><div class="panel"><h2>Boutons modifiables</h2><form id="buttonForm" class="row"><input name="label" placeholder="Texte du bouton" required><input name="url" placeholder="#admission ou https://..." required><input name="description" placeholder="Description"><button>Ajouter</button></form><div id="buttons"></div></div></div></div><script src="admin.js"></script></body></html>
