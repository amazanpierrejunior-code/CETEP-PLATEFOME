<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Administration</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="brand-wrap"><div id="logo" class="logo">CETEP</div><div><div id="brand" class="brand">CETEP</div><div id="sub" class="brand-sub">Administration</div></div></div><button class="btn secondary" onclick="logout()">Déconnexion</button></header><div class="side"><aside class="nav"><button class="btn active" onclick="tab('dash',this)">📊 Tableau de bord</button><button class="btn" onclick="tab('students',this)">👨🏽‍🎓 Étudiants</button><button class="btn" onclick="tab('teachers',this)">👨🏽‍🏫 Professeurs</button><button class="btn" onclick="tab('programs',this)">📚 Formations</button><button class="btn" onclick="tab('content',this)">📖 Modules / Leçons</button><button class="btn" onclick="tab('payments',this)">💰 Paiements</button><button class="btn" onclick="tab('settings',this)">🎨 Apparence</button></aside><main class="main"><section id="dash"><h1>Tableau de bord CETEP</h1><div id="stats" class="grid"></div></section><section id="students" class="hidden"><h1>Étudiants</h1><button class="btn" onclick="addStudent()">➕ Ajouter un étudiant</button><div class="card"><div id="studentsTable"></div></div></section><section id="teachers" class="hidden"><h1>Professeurs</h1><button class="btn" onclick="addTeacher()">➕ Ajouter un professeur</button><div class="card"><div id="teachersTable"></div></div></section><section id="programs" class="hidden"><h1>Formations</h1><button class="btn" onclick="addProgram()">➕ Ajouter une formation</button><div class="card"><div id="programsTable"></div></div></section><section id="content" class="hidden"><h1>Modules / Leçons</h1><div class="grid"><div class="card"><h3>Ajouter un module</h3><form id="mf"><select class="input" name="program_id" id="mp" required></select><input class="input" name="title" placeholder="Titre" required><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn">Ajouter</button></form></div><div class="card"><h3>Ajouter une leçon</h3><form id="lf"><select class="input" name="module_id" id="lm" required></select><input class="input" name="title" placeholder="Titre" required><textarea class="input" name="content" placeholder="Contenu"></textarea><button class="btn">Ajouter</button></form></div></div><div class="card"><div id="contentTable"></div></div></section><section id="payments" class="hidden"><h1>Paiements</h1><div class="card"><form id="pf"><div class="row"><select class="input" name="student_id" id="ps" required></select><input class="input" name="amount_htg" type="number" placeholder="Montant HTG" required><input class="input" name="method" value="Manuel" placeholder="Méthode"><button class="btn">Enregistrer</button></div></form><div id="paymentsTable"></div></div></section><section id="settings" class="hidden"><h1>🎨 Apparence & identité</h1><div class="grid"><div class="card"><form id="sf"><input class="input" name="school_name" placeholder="Nom court"><input class="input" name="school_full_name" placeholder="Nom complet"><input class="input" name="slogan" placeholder="Slogan"><input class="input" name="logo_text" placeholder="Texte du logo"><input class="input" name="logo_url" placeholder="URL du logo (optionnel)"><label>Ou téléverser un logo (PNG/JPG/WebP, 2 Mo max)</label><input class="input" id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="preview" style="margin:10px 0;text-align:center"><img id="logoPreview" alt="Aperçu du logo" style="max-width:180px;max-height:120px;object-fit:contain;background:#fff;border-radius:12px;padding:8px;display:none"><div id="logoPreviewText">Logo CETEP par défaut</div></div><div class="row"><button class="btn" type="submit">💾 Enregistrer l’identité</button><button class="btn secondary" type="button" onclick="resetLogo()">🔄 Restaurer le logo par défaut</button></div></form></div><div class="card"><form id="cf"><label>Couleur principale</label><input class="color-input" type="color" name="primary_color"><label>Couleur secondaire</label><input class="color-input" type="color" name="secondary_color"><label>Couleur accent</label><input class="color-input" type="color" name="accent_color"><button class="btn">🎨 Enregistrer les couleurs</button></form><p>Le logo peut être changé à tout moment.</p></div></div></section></main></div><div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="mt"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mb"></div></div></div><script>const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login';return}const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}function fo(f){return Object.fromEntries(new FormData(f))}function tab(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');document.querySelectorAll('.nav .btn').forEach(x=>x.classList.remove('active'));b?.classList.add('active');({dash:loadDash,students:loadStudents,teachers:loadTeachers,programs:loadPrograms,content:loadContent,payments:loadPayments,settings:loadSettings}[id]||loadDash)()}async function brand(){const s=await api('/api/admin/settings');for(const k of ['primary_color','secondary_color','accent_color'])document.documentElement.style.setProperty('--'+k.replace('_color',''),s[k]);$('#brand').textContent=s.school_name;$('#sub').textContent=s.school_full_name;$('#logo').textContent=s.logo_text||s.school_name;if(s.logo_url)$('#logo').innerHTML='<img src="'+s.logo_url+'" alt="Logo">'}async function loadDash(){const s=await api('/api/admin/stats');$('#stats').innerHTML=Object.entries({Étudiants:s.students,Professeurs:s.teachers,Formations:s.programs,'En attente':s.pending,Revenus:s.revenue+' HTG'}).map(([a,b])=>'<div class="card"><div>'+a+'</div><div class="stat">'+b+'</div></div>').join('');brand()}async function loadStudents(){const [a,p]=await Promise.all([api('/api/admin/students'),api('/api/admin/programs')]);$('#studentsTable').innerHTML='<table class="table"><tr><th>Code</th><th>Nom</th><th>Formation</th><th>Téléphone</th><th>Statut</th><th>Accès</th></tr>'+a.map(s=>'<tr><td>'+esc(s.student_no)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.program_name||'—')+'</td><td>'+esc(s.phone||'')+'</td><td>'+esc(s.status)+'</td><td>'+(s.access_enabled?'🟢':'🔴')+'</td></tr>').join('')+'</table>';window._programs=p;$('#ps').innerHTML='<option value="">Étudiant</option>'+a.map(s=>'<option value="'+s.id+'">'+esc(s.student_no)+' — '+esc(s.name)+'</option>').join('')}function openM(t,b){$('#mt').textContent=t;$('#mb').innerHTML=b;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}function addStudent(){openM('Ajouter un étudiant','<form id="x"><input class="input" name="name" placeholder="Nom complet" required><input class="input" name="phone" placeholder="Téléphone" required><input class="input" name="email" placeholder="Email"><input class="input" name="birth_date" type="date"><select class="input" name="program_id" required>'+window._programs.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><input class="input" name="education" placeholder="Niveau d’études"><input class="input" name="password" value="123456" placeholder="Mot de passe"><button class="btn">Créer</button></form>');x.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});closeModal();loadStudents();loadDash()}catch(err){alert(err.message)}}}async function loadTeachers(){const a=await api('/api/admin/teachers');$('#teachersTable').innerHTML='<table class="table"><tr><th>Code</th><th>Nom</th><th>Email</th><th>Statut</th></tr>'+a.map(t=>'<tr><td>'+esc(t.teacher_no)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.email)+'</td><td>'+(t.active?'Actif':'Inactif')+'</td></tr>').join('')+'</table>'}function addTeacher(){openM('Ajouter un professeur','<form id="x"><input class="input" name="name" placeholder="Nom complet" required><input class="input" name="email" placeholder="Email" required><input class="input" name="phone" placeholder="Téléphone"><input class="input" name="password" value="123456" placeholder="Mot de passe"><button class="btn">Créer</button></form>');x.onsubmit=async e=>{e.preventDefault();await api('/api/admin/teachers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});closeModal();loadTeachers();loadDash()}}async function loadPrograms(){const a=await api('/api/admin/programs');window._programs=a;$('#programsTable').innerHTML='<table class="table"><tr><th>Formation</th><th>Durée</th><th>Prix</th><th>Statut</th></tr>'+a.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.duration)+'</td><td>'+p.price_htg+' HTG</td><td>'+(p.active?'Active':'Inactive')+'</td></tr>').join('')+'</table>'}function addProgram(){openM('Ajouter une formation','<form id="x"><input class="input" name="name" placeholder="Nom" required><input class="input" name="duration" placeholder="Durée"><input class="input" name="price_htg" type="number" placeholder="Prix HTG"><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn">Créer</button></form>');x.onsubmit=async e=>{e.preventDefault();await api('/api/admin/programs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});closeModal();loadPrograms();loadDash()}}async function loadContent(){const [m,l,p]=await Promise.all([api('/api/admin/modules'),api('/api/admin/lessons'),api('/api/admin/programs')]);mp.innerHTML='<option value="">Formation</option>'+p.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');lm.innerHTML='<option value="">Module</option>'+m.map(x=>'<option value="'+x.id+'">'+esc(x.program_name)+' — '+esc(x.title)+'</option>').join('');contentTable.innerHTML='<h3>Modules</h3>'+m.map(x=>'<div class="card">'+esc(x.program_name)+' — <b>'+esc(x.title)+'</b></div>').join('')+'<h3>Leçons</h3>'+l.map(x=>'<div class="card">'+esc(x.program_name)+' / '+esc(x.module_title)+' — <b>'+esc(x.title)+'</b></div>').join('')}mf.onsubmit=async e=>{e.preventDefault();await api('/api/admin/modules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});e.target.reset();loadContent()};lf.onsubmit=async e=>{e.preventDefault();await api('/api/admin/lessons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});e.target.reset();loadContent()};async function loadPayments(){const a=await api('/api/admin/payments');paymentsTable.innerHTML='<table class="table"><tr><th>Référence</th><th>Étudiant</th><th>Montant</th><th>Méthode</th><th>Statut</th></tr>'+a.map(x=>'<tr><td>'+esc(x.reference)+'</td><td>'+esc(x.student_name||'')+'</td><td>'+x.amount_htg+' HTG</td><td>'+esc(x.method)+'</td><td>'+esc(x.status)+'</td></tr>').join('')+'</table>';loadStudents()}pf.onsubmit=async e=>{e.preventDefault();await api('/api/admin/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});e.target.reset();loadPayments();loadDash()};async function loadSettings(){const s=await api('/api/admin/settings');for(const k of ['school_name','school_full_name','slogan','logo_text','logo_url'])sf[k].value=s[k]||'';for(const k of ['primary_color','secondary_color','accent_color'])cf[k].value=s[k]||'#0d2b52';if(s.logo_url){logoPreview.src=s.logo_url;logoPreview.style.display='inline-block';logoPreviewText.style.display='none'}else{logoPreview.style.display='none';logoPreviewText.style.display='block'}}sf.onsubmit=async e=>{e.preventDefault();let b=fo(e.target),f=logoFile.files[0];if(f){if(f.size>2*1024*1024){alert('Logo trop grand. Maximum 2 Mo.');return}b.logo_url=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});await brand();await loadSettings();alert('Identité enregistrée. Le nouveau logo est maintenant sauvegardé.');};
logoFile.onchange=()=>{const f=logoFile.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{logoPreview.src=r.result;logoPreview.style.display='inline-block';logoPreviewText.style.display='none'};r.readAsDataURL(f)};
async function resetLogo(){if(!confirm('Restaurer le logo CETEP par défaut ?'))return;await api('/api/admin/logo/reset',{method:'POST'});await brand();await loadSettings();alert('Logo par défaut restauré.')}cf.onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(fo(e.target))});brand();alert('Couleurs enregistrées.')};async function logout(){await api('/api/logout',{method:'POST'});location.href='/login'}loadDash();brand();</script></body></html>
