<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CETEP</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"><div class="brand">CETEP — Administration</div><button class="btn secondary" onclick="logout()">Déconnexion</button></header>
<div class="side"><aside class="nav"><button class="btn" onclick="tab('dash')">Tableau de bord</button><button class="btn" onclick="tab('students')">Étudiants</button><button class="btn" onclick="tab('teachers')">Professeurs</button><button class="btn" onclick="tab('programs')">Formations</button><button class="btn" onclick="tab('content')">Modules / Leçons</button><button class="btn" onclick="tab('payments')">Paiements</button></aside><main class="main">
<section id="dash"><h1>Tableau de bord</h1><div id="stats" class="grid"></div></section>
<section id="students" class="hidden"><h1>Étudiants</h1><div class="card"><div id="studentsTable"></div></div></section>
<section id="teachers" class="hidden"><h1>Professeurs</h1><div class="card"><form id="teacherForm"><div class="row"><input class="input" name="name" placeholder="Nom" required><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="phone" placeholder="Téléphone"><input class="input" name="password" type="password" placeholder="Mot de passe" required></div><button class="btn">Créer le professeur</button></form><hr><div id="teachersTable"></div></div></section>
<section id="programs" class="hidden"><h1>Formations</h1><div class="card"><form id="programForm"><div class="row"><input class="input" name="name" placeholder="Nom de la formation" required><input class="input" name="duration" placeholder="Durée"><input class="input" name="price_htg" type="number" placeholder="Prix HTG"></div><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn">Ajouter</button></form><hr><div id="programsTable"></div></div></section>
<section id="content" class="hidden"><h1>Contenu pédagogique</h1><div class="card"><h3>Ajouter un module</h3><form id="moduleForm"><div class="row"><select class="input" name="program_id" id="moduleProgram"></select><input class="input" name="title" placeholder="Titre du module" required><input class="input" name="order_no" type="number" value="1"></div><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn">Ajouter module</button></form><hr><h3>Ajouter une leçon</h3><form id="lessonForm"><div class="row"><select class="input" name="module_id" id="lessonModule"></select><input class="input" name="title" placeholder="Titre de la leçon" required><select class="input" name="type"><option>Texte</option><option>Vidéo</option><option>PDF</option><option>Lien</option></select><input class="input" name="order_no" type="number" value="1"></div><textarea class="input" name="content" placeholder="Contenu / texte"></textarea><div class="row"><input class="input" name="video_url" placeholder="URL vidéo"><input class="input" name="file_url" placeholder="URL PDF/fichier"></div><button class="btn">Ajouter leçon</button></form><hr><div id="contentTable"></div></div></section>
<section id="payments" class="hidden"><h1>Paiements</h1><div class="card"><form id="payForm"><div class="row"><select class="input" name="student_id" id="payStudent"></select><input class="input" name="amount_htg" type="number" placeholder="Montant HTG" required><input class="input" name="method" placeholder="Méthode" value="Manuel"></div><button class="btn">Enregistrer paiement</button></form><hr><div id="paymentsTable"></div></div></section>
</main></div>
<script>
const $=s=>document.querySelector(s); const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(url,opt){let r=await fetch(url,opt);if(r.status===401){location.href='/login';return null}let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
function tab(id){['dash','students','teachers','programs','content','payments'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='students')loadStudents();if(id==='teachers')loadTeachers();if(id==='programs')loadPrograms();if(id==='content')loadContent();if(id==='payments')loadPayments()}
async function load(){let s=await api('/api/admin/stats');$('#stats').innerHTML=[['Étudiants',s.students],['Actifs',s.activeStudents],['Professeurs',s.teachers],['Formations',s.programs],['En attente',s.pending],['Revenus',s.revenue+' HTG']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('');loadPrograms()}
async function loadStudents(){let a=await api('/api/admin/students');$('#studentsTable').innerHTML='<table class="table"><tr><th>Code</th><th>Nom</th><th>Formation</th><th>Statut</th><th>Accès</th><th>Action</th></tr>'+a.map(s=>`<tr><td>${esc(s.student_no)}</td><td>${esc(s.name)}</td><td>${esc(s.program_name)}</td><td>${esc(s.status)}</td><td>${s.access_enabled?'Ouvert':'Fermé'}</td><td><button class="btn ${s.access_enabled?'danger':'success'}" onclick="toggleStudent(${s.id},${!s.access_enabled})">${s.access_enabled?'Fermer':'Activer'}</button></td></tr>`).join('')+'</table>';$('#payStudent').innerHTML='<option value="">Élève</option>'+a.map(s=>`<option value="${s.id}">${esc(s.student_no)} — ${esc(s.name)}</option>`).join('')}
async function toggleStudent(id,on){let p=prompt(on?'Créez le mot de passe initial de cet élève (6 caractères minimum):':'Optionnel: laissez vide pour garder le mot de passe');if(on&&!p)return;await api('/api/admin/students/'+id+'/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on,status:on?'Actif':'Suspendu',password:p||undefined})});loadStudents();load()}
async function loadTeachers(){let a=await api('/api/admin/teachers');$('#teachersTable').innerHTML='<table class="table"><tr><th>Code</th><th>Nom</th><th>Email</th><th>Actif</th></tr>'+a.map(t=>`<tr><td>${esc(t.teacher_no)}</td><td>${esc(t.name)}</td><td>${esc(t.email)}</td><td>${t.active?'Oui':'Non'}</td></tr>`).join('')+'</table>'}
$('#teacherForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/teachers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();loadTeachers();load()}
async function loadPrograms(){let a=await api('/api/admin/programs');$('#programsTable').innerHTML='<table class="table"><tr><th>ID</th><th>Formation</th><th>Durée</th><th>Prix</th></tr>'+a.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(p.duration)}</td><td>${p.price_htg} HTG</td></tr>`).join('')+'</table>';$('#moduleProgram').innerHTML=a.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
$('#programForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/programs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();loadPrograms();load()}
async function loadContent(){let [m,l,p]=await Promise.all([api('/api/admin/modules'),api('/api/admin/lessons'),api('/api/admin/programs')]);$('#moduleProgram').innerHTML=p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#lessonModule').innerHTML=m.map(x=>`<option value="${x.id}">${esc(x.program_name)} — ${esc(x.title)}</option>`).join('');$('#contentTable').innerHTML='<h3>Modules</h3>'+m.map(x=>`<div class="lesson"><b>${esc(x.program_name)}</b> — ${esc(x.title)}</div>`).join('')+'<h3>Leçons</h3>'+l.map(x=>`<div class="lesson"><b>${esc(x.module_title)}</b> — ${esc(x.title)} <span class="pill">${esc(x.type)}</span></div>`).join('')}
$('#moduleForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/modules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();loadContent()}
$('#lessonForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/lessons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();loadContent()}
async function loadPayments(){let a=await api('/api/admin/payments');$('#paymentsTable').innerHTML='<table class="table"><tr><th>Référence</th><th>Élève</th><th>Montant</th><th>Méthode</th><th>Statut</th></tr>'+a.map(x=>`<tr><td>${esc(x.reference)}</td><td>${esc(x.student_name)}</td><td>${x.amount_htg} HTG</td><td>${esc(x.method)}</td><td>${esc(x.status)}</td></tr>`).join('')+'</table>';if(!$('#payStudent').options.length)loadStudents()}
$('#payForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();loadPayments();load()}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}
load();
</script></body></html>
