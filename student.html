<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Espace étudiant</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div><div class="brand">CETEP — Espace étudiant</div><div class="brand-sub" id="me"></div></div><button class="btn secondary" onclick="logout()">Déconnexion</button></header><main class="container"><div class="card"><h2>Mes cours</h2><div id="content"></div></div></main><script>const $=s=>document.querySelector(s);async function api(u,o){const r=await fetch(u,o);if(r.status===401)location='/login';const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){const [me,c]=await Promise.all([api('/api/student/me'),api('/api/student/content')]);$('#me').textContent=me.name+' • '+me.program_name+' • '+me.student_no;let last='';$('#content').innerHTML=c.map(x=>{let h='';if(x.module_id!==last){last=x.module_id;h+='<h3>'+x.module_title+'</h3>'}h+='<div class="card"><b>'+x.lesson_title+'</b><p>'+String(x.content||'').replace(/</g,'&lt;')+'</p>'+(x.video_url?'<p><a class="btn" target="_blank" href="'+x.video_url+'">🎥 Ouvrir le cours vidéo</a></p>':'')+(x.file_url?'<p><a class="btn" target="_blank" href="'+x.file_url+'">📄 Document</a></p>':'')+(x.completed?'✅ Terminé':'<button class="btn" onclick="done('+x.lesson_id+')">Marquer terminé</button>')+'</div>';return h}).join('')||'<p>Aucun cours publié pour le moment.</p>'}async function done(id){await api('/api/student/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson_id:id})});load()}async function logout(){await api('/api/logout',{method:'POST'});location='/login'}load()</script></body></html>
