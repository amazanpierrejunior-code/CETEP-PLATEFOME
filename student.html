<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace étudiant CETEP</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"><div class="brand">CETEP — Espace étudiant</div><button class="btn secondary" onclick="logout()">Déconnexion</button></header><main class="wrap"><div id="profile" class="card"></div><h2>Mes formations</h2><div id="courses" class="grid"></div><div id="course" style="margin-top:20px"></div><h2>Mes devoirs</h2><div id="assignments"></div></main>
<script>
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(u,o){let r=await fetch(u,o);if(r.status===401){location.href='/login';return null}let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
async function load(){let [me,c,a]=await Promise.all([api('/api/student/me'),api('/api/student/courses'),api('/api/student/assignments')]);$('#profile').innerHTML=`<h1>Bonjour ${esc(me.name)}</h1><p>Code étudiant: <b>${esc(me.student_no)}</b> · Statut: <span class="pill">${esc(me.status)}</span></p>`;$('#courses').innerHTML=c.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><div class="progress"><i style="width:${x.progress}%"></i></div><p>${x.progress}% complété</p><button class="btn" onclick="openCourse(${x.id})">Ouvrir</button></div>`).join('');$('#assignments').innerHTML=a.length?a.map(x=>`<div class="card" style="margin:10px 0"><h3>${esc(x.title)}</h3><p>${esc(x.instructions)}</p><p>Note: ${x.score??'Non corrigé'} / ${x.max_score}</p><textarea id="ans${x.id}" class="input" placeholder="Votre réponse">${esc(x.answer||'')}</textarea><button class="btn" onclick="submitA(${x.id})">Envoyer</button></div>`).join(''):'<div class="card">Aucun devoir.</div>'}
async function openCourse(id){let d=await api('/api/student/course/'+id);$('#course').innerHTML=`<div class="card"><h2>${esc(d.program.name)}</h2>${d.modules.map(m=>`<h3>Module ${m.order_no}: ${esc(m.title)}</h3>${m.lessons.map(l=>`<div class="lesson ${l.completed?'done':''}"><b>${esc(l.title)}</b> <span class="pill">${esc(l.type)}</span><p>${esc(l.content)}</p>${l.video_url?`<p><a href="${esc(l.video_url)}" target="_blank">▶ Ouvrir la vidéo</a></p>`:''}${l.file_url?`<p><a href="${esc(l.file_url)}" target="_blank">📄 Ouvrir le document</a></p>`:''}<button class="btn ${l.completed?'secondary':'success'}" onclick="complete(${l.id},${id})">${l.completed?'Leçon terminée':'Marquer comme terminée'}</button></div>`).join('')}`).join('')}</div>`}
async function complete(l,p){await api('/api/student/lesson/'+l+'/complete',{method:'POST'});openCourse(p);load()}
async function submitA(id){await api('/api/student/assignments/'+id+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:$('#ans'+id).value})});alert('Devoir envoyé.')}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}load()
</script></body></html>
