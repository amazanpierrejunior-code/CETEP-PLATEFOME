<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETEP — Espace étudiant</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div><div class="brand">CETEP — Espace étudiant</div><div class="brand-sub" id="me"></div></div><button class="btn secondary" onclick="logout()">Déconnexion</button></header><main class="container">
<div class="card"><h2>🎓 Mon certificat</h2><p>Votre certificat devient disponible automatiquement après réussite, 100 % de progression et paiement complet.</p><div id="certificateBox">Vérification en cours...</div></div>
<div class="card"><h2>📚 Mes cours en ligne</h2><div id="content"></div></div></main>
<script>const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/login';return}const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
async function loadCertificate(){try{const j=await api('/api/student/certificate');$('#certificateBox').innerHTML='<p>🎉 Votre certificat est disponible.</p><a class="btn" target="_blank" href="'+j.download+'?v=14.2.0">📄 Télécharger mon certificat PDF</a><p><small>N° '+esc(j.certificate.certificate_no)+'</small></p>'}catch(e){$('#certificateBox').innerHTML='<p>🔒 '+esc(e.message)+'</p><small>Conditions : réussite de la formation, 100 % des leçons publiées terminées et paiement complet des frais.</small>'}}
async function load(){const [me,c]=await Promise.all([api('/api/student/me'),api('/api/student/content')]);$('#me').textContent=me.name+' • '+me.program_name+' • '+me.student_no;let last='';$('#content').innerHTML=c.map(x=>{let h='';if(x.module_id!==last){last=x.module_id;h+='<h3>'+esc(x.module_title)+'</h3>'}h+='<div class="card"><b>'+esc(x.lesson_title)+'</b><p>'+esc(x.content||'')+'</p>'+(x.video_url?'<p><a class="btn" target="_blank" href="'+esc(x.video_url)+'">🎥 Voir la vidéo</a></p>':'')+(x.file_url?'<p><a class="btn" target="_blank" href="'+esc(x.file_url)+'">📄 Document/PDF</a></p>':'')+(x.type==='Classe en ligne'&&x.meeting_url?'<p>🔴 '+(x.scheduled_at?'Classe : '+new Date(x.scheduled_at).toLocaleString('fr-FR'):'Classe en ligne')+'<br><a class="btn" target="_blank" href="'+esc(x.meeting_url)+'">Rejoindre le cours</a></p>':'')+(x.completed?'✅ Terminé':'<button class="btn" onclick="done('+x.lesson_id+')">Marquer terminé</button>')+'</div>';return h}).join('')||'<p>Aucun cours publié pour le moment.</p>';loadCertificate()}async function done(id){await api('/api/student/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson_id:id})});load()}async function logout(){await api('/api/logout',{method:'POST'});location='/login'}load()</script></body></html>
